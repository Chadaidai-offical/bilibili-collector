name: 功能建议
description: 提出一个新功能，或对现有功能提出改进想法
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出想法。为了让建议更容易被采纳，请尽量说明「你遇到的实际困扰」，而不只是「我想要某个按钮」。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 现在是什么场景让你觉得不方便？频率大概多高？
      placeholder: 我收藏了 2000 多条视频，想按「分区」筛出一批然后整体导出，现在只能一条条看。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的做法
      description: 你期望它怎么工作？如果有参考产品或类似软件的做法，也可以描述一下
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其它方案
      description: 现在你是怎么绕过这个问题的？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 截图、草图、任何有助于说明的材料
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 issue，确认没有重复
          required: true
