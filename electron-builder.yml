{
  "appId": "com.chadaidai.bilibili-collector",
  "productName": "B站收藏管理",
  "directories": {
    "output": "dist"
  },
  "files": [
    "out/**/*"
  ],
  "extraResources": [
    {
      "from": "resources/ffmpeg",
      "to": "ffmpeg",
      "filter": ["ffmpeg.exe"]
    }
  ],
  "win": {
    "target": "nsis"
  },
  "nsis": {
    "oneClick": false,
    "allowToChangeInstallationDirectory": true
  }
}
